# Local stack: PostgreSQL + the Atria API. Run with `docker compose up --build`.
# The API applies EF migrations on startup (Database__MigrateOnStartup=true) so the
# schema is ready automatically. Dev secrets come from appsettings.json defaults —
# override them with real values via environment / a secret store for anything real.

# Pinned so the Compose project name (and therefore the auto-named atria-pgdata volume
# below) stays "atria" no matter which host directory this file is deployed from. Without
# this, Compose derives the project name from the working directory basename — moving the
# deploy path (see deploy.yml) would silently create a NEW, empty "<dir>_atria-pgdata"
# volume instead of reattaching to the existing production data.
name: atria

services:
  db:
    image: postgres:16-alpine
    container_name: atria-db
    environment:
      POSTGRES_USER: atria
      # Required: set via GitHub Actions secret on deploy, or the project .env locally.
      # NOTE: POSTGRES_PASSWORD only takes effect when the data volume is FIRST initialized.
      # The existing prod volume was created with "atria", so this secret MUST equal the
      # current password unless you intentionally reset the atria-pgdata volume.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: atria
    # Postgres is NOT published to the host here so the DB is never exposed on the public
    # server. Local development publishes 5432 via docker-compose.override.yml (auto-merged
    # by `docker compose up`, but excluded from the server deploy which uses `-f docker-compose.yml`).
    volumes:
      - atria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atria -d atria"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atria-api
    depends_on:
      db:
        condition: service_healthy
    # There is deliberately NO `env_file:` here. It injected the server's whole .env into the
    # container, so ANY key sitting in that file — including ones this compose never mentions,
    # like AllowedHosts or Cors__AllowedOrigins — silently outranked appsettings.json. That is how
    # the deployed hostnames drifted away from the committed config with nothing in the repo to
    # show it. Secrets still come from that same .env: compose interpolates ${VAR} below from the
    # shell environment (exported by deploy.yml) or from the project .env, without handing the
    # container anything that was not asked for by name here.
    #
    # Rule of thumb: SECRETS are ${...} in this file, everything else — hostnames, URLs, paths —
    # belongs in appsettings.json where it is reviewable in a diff.
    environment:
      # Production by default (this base file is what the server deploy runs). Local dev
      # overrides this back to Development in docker-compose.override.yml (Swagger, dev keys).
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Point the app at the db service (overrides the appsettings default). The password
      # is interpolated from the same POSTGRES_PASSWORD variable used by the db service.
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=atria;Username=atria;Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      # Auto-apply migrations on startup so the stack is usable immediately.
      Database__MigrateOnStartup: "true"
      # Demo-data seeding is OFF in production. Local dev turns it on via the override file.
      Database__SeedOnStartup: "false"
      # JWT signing secret + at-rest PII encryption key. REQUIRED (:? guard fails the deploy
      # if unset/empty) so production can NEVER fall back to the committed dev keys in
      # appsettings.json. Supplied from GitHub Actions secrets on deploy (see deploy.yml) and
      # from the project .env for local runs. Jwt__SigningKey: >=32 chars; Encryption__Key: base64 of 32 bytes.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Encryption__Key: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      # Pepper for the stored OTP hash — see OtpOptions.HashPepper. Must differ from ENCRYPTION_KEY:
      # one leaked secret should not hand over both the PII at rest and the login codes.
      Otp__HashPepper: ${OTP_HASH_PEPPER:?OTP_HASH_PEPPER is required}
      # Authenticates this API to the custody signer and signs each request over its body. Optional
      # on purpose: an empty value only means the request goes unsigned, which the app warns about
      # loudly rather than refusing to start — the signer is not reachable from every environment.
      Blockchain__SignerSharedSecret: ${BLOCKCHAIN_SIGNER_SHARED_SECRET:-}
      # Key of the registry/allowlist agent that signs anchor writes (Blockchain:Anchor). REQUIRED:
      # EvmAnchorOptions marks it [Required] and validates on start, so the API refuses to boot
      # without it — appsettings.json ships it blank because it is a secret.
      #
      # Two names are accepted. The server .env predates this line and holds the raw config key
      # (Blockchain__Anchor__AgentPrivateKey), which used to reach the container only because
      # `env_file:` injected that file wholesale; the shell-style name matches every other secret
      # here and is what deploy.yml forwards. Whichever is set wins, so no .env has to be rewritten.
      Blockchain__Anchor__AgentPrivateKey: ${BLOCKCHAIN_ANCHOR_AGENT_PRIVATE_KEY:-${Blockchain__Anchor__AgentPrivateKey:-}}
      # Public media (property photos/documents): the API copies files to the media host over SCP
      # and stores an absolute URL served by that host's nginx. ONLY the credentials live here —
      # PublicBaseUrl, PublicBasePath, RemoteRoot, ScpHost and ScpPort are in appsettings.json.
      # PublicBaseUrl especially: it is baked into every media URL written to the database, so an
      # environment override rots the links of everything uploaded while it was in force.
      Media__ScpUsername: ${MEDIA_SCP_USERNAME:-}
      Media__ScpPassword: ${MEDIA_SCP_PASSWORD:-}
      # Nikita Pro SMS gateway credentials, mapped from the NIKITA_PRO_* variables. On deploy
      # those come from GitHub Actions secrets exported into the SSH session (see deploy.yml);
      # for a local `docker compose up` they come from the project .env (compose interpolates
      # ${...} from the shell env or .env). The :? guard FAILS the deploy with a clear message if
      # a variable is unset/empty, so a misconfigured secret can never boot the app with blank
      # credentials.
      # TEMPORARY: SMS delivery is disabled in code (DisabledSmsSender) and the gateway
      # credentials are no longer read by the app, so they are not passed into the container
      # at all. Uncomment all three lines when SMS is turned back on.
      # NikitaPro__Login: ${NIKITA_PRO_LOGIN:?NIKITA_PRO_LOGIN is required}
      # NikitaPro__ApiKey: ${NIKITA_PRO_API_KEY:?NIKITA_PRO_API_KEY is required}
      # Sender is not secret; pin it explicitly so it can't drift from the approved name.
      # NikitaPro__Sender: MYDATACOIN
      # There is deliberately no Otp__MagicCode here. A fixed code accepted for any phone is an
      # unauthenticated account takeover, and OtpOptions no longer binds such a setting at all. If
      # the SMS provider goes down again, the answer is an audited admin-side action against a named
      # account — not a global bypass one env var away from being live.
      # Admin / Realtor / SuperAdmin logins are DB-only: each is an ordinary users row (username +
      # password hash) created via scripts/seed-superadmin.sql. No credentials in config or secrets —
      # they log in through POST /auth/admin/login (admin & super-admin) and /auth/realtor/login.
      # Referral__BaseUrl is NOT here: the realtor referral link target is a plain public URL,
      # so it lives in appsettings.json (Referral:BaseUrl) like every other hostname.
      # Didit hosted-KYC secrets, mapped from the DIDIT_* variables (same flow as NIKITA_PRO_*:
      # GitHub Actions secrets exported into the SSH session, see deploy.yml; local `docker
      # compose up` reads them from the project .env). The :? guard fails the deploy with a
      # clear message if unset/empty, so the app can never boot with a blank Didit key/secret.
      # WorkflowId is NOT a secret — it lives in appsettings.json.
      Didit__ApiKey: ${DIDIT_API_KEY:?DIDIT_API_KEY is required}
      Didit__WebhookSecret: ${DIDIT_WEBHOOK_SECRET:?DIDIT_WEBHOOK_SECRET is required}
    ports:
      - "8080:8080"
    restart: unless-stopped
    # Container hardening (CIS Docker Benchmark 5.3 / 5.10 / 5.12 / 5.25). The app writes nothing to
    # its own filesystem — uploads go to S3 and the media host over SCP — so a read-only root costs
    # nothing and removes the usual foothold for dropping a payload next to the binary.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 256
    # Probed with bash's /dev/tcp rather than a HTTP client: the aspnet runtime image ships
    # neither wget nor curl, so the previous `wget -qO- ...` test failed with "wget: not found"
    # on every single run and the container sat permanently (unhealthy) while serving traffic
    # perfectly well — a health signal that is always red is the same as having none.
    #
    # This speaks HTTP/1.1 over that socket using only what the image already has (bash, head,
    # grep — verified present), and matches the STATUS LINE, so a port that listens but answers
    # 404 or 503 still fails. No shell variable is used, so there is no $-escaping to get wrong.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  atria-pgdata:

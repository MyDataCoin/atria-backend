name: CI + Deploy

# Build & test on every push/PR; deploy to the Ubuntu server only on pushes to the
# default branch (and manual runs). All connection details are GitHub Secrets — nothing
# sensitive lives in this file.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # external/tessera is a git SUBMODULE, and Atria.Infrastructure reaches Nethereum only
          # through its ProjectReference into it. A plain checkout leaves that directory empty, the
          # reference resolves to nothing, and the build fails on every Nethereum type.
          submodules: recursive

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Atria.sln

      - name: Build
        run: dotnet build Atria.sln -c Release --no-restore

      - name: Test
        run: dotnet test Atria.sln -c Release --no-build --verbosity normal

      # A restore that resolves a package with a known advisory should not reach production. The
      # command reports rather than fails, so the exit code has to be derived from its output.
      - name: Vulnerable packages
        run: |
          set -o pipefail
          dotnet list Atria.sln package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later removed is still a leaked secret,
          # and this repository has had blank-able keys in appsettings.json before.
          fetch-depth: 0

      - name: Gitleaks
        # The gitleaks ACTION requires a paid licence for organisation-owned repositories; the
        # scanner it wraps does not. Pinned by digest-less tag on the official image, which is the
        # same binary without the licence check.
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.21.2 \
            detect --source . --redact --no-banner --verbose

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build-test, security]
    # Never deploy from pull requests (incl. forks) — only direct pushes / manual runs.
    if: github.event_name != 'pull_request'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check deploy secrets
        # TWO classes of secret are checked here, both before anything is copied to the server.
        #
        # SSH credentials, so a missing one is not reported as appleboy's opaque "can't connect
        # without a private SSH key or password"; and every variable docker-compose.yml marks
        # required with `${VAR:?}`, because otherwise the first sign of a missing one is compose
        # aborting ON THE SERVER, after the bundle has been copied and with the running stack
        # already torn down. The required list is read out of the compose file rather than
        # duplicated, so adding a `${NEW_VAR:?}` there cannot drift from this check.
        # appleboy/ssh-action reports a missing key as "can't connect without a private SSH key or
        # password", which does not say WHICH secret is absent or what to do about it. Fail here
        # instead, before a bundle is built and copied, with the actual instruction.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_PASSWORD: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          # The application secrets docker-compose.yml marks required. Checked here so a missing
          # one fails in ten seconds rather than after the bundle is on the server.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER }}
          NIKITA_PRO_LOGIN: ${{ secrets.NIKITA_PRO_LOGIN }}
          NIKITA_PRO_API_KEY: ${{ secrets.NIKITA_PRO_API_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          # Either credential will do. The key is preferred; the password keeps the deploy
          # working until one is issued.
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_SSH_PASSWORD" ]; then
            missing="$missing DEPLOY_SSH_KEY-or-DEPLOY_SSH_PASSWORD"
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo ""
            echo "Set DEPLOY_SSH_PASSWORD to deploy with the password you already have, or"
            echo "DEPLOY_SSH_KEY to switch to key authentication (preferred — the same session"
            echo "carries the database password and the provider API keys to the server):"
            echo "  ssh-keygen -t ed25519 -C 'github-actions-deploy' -f ./atria_deploy -N ''"
            echo "  ssh-copy-id -i ./atria_deploy.pub $DEPLOY_USER@$DEPLOY_HOST"
            echo "  gh secret set DEPLOY_SSH_KEY < ./atria_deploy   # the PRIVATE key, whole file"
            echo "  rm ./atria_deploy ./atria_deploy.pub"
            exit 1
          fi

          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Deploying with a PASSWORD. This session also carries the database" \
                 "password and the provider API keys — move to DEPLOY_SSH_KEY when one is issued."
          else
            echo "Deploying with an SSH key."
          fi

          # Every ${VAR:?...} in docker-compose.yml has to arrive in the remote shell.
          app_missing=""
          for var in $(grep -oE '\$\{[A-Z_]+:\?' docker-compose.yml | tr -d '${:?' | sort -u); do
            eval "value=\${$var:-}"
            [ -z "$value" ] && app_missing="$app_missing $var"
          done

          if [ -n "$app_missing" ]; then
            echo "::error::docker-compose.yml requires these, and they are not set as repository secrets:$app_missing"
            echo ""
            echo "Each is a secret the app refuses to start without, by design — see SecretsGuard."
            echo "Generate a value with:  openssl rand -base64 32"
            echo "Then, for each one:     gh secret set <NAME>"
            exit 1
          fi

          echo "All secrets required by docker-compose.yml are present."

      - name: Package deployment bundle
        # `external` carries the Tessera submodule that Atria.Infrastructure project-references.
        # Leaving it out ships a bundle whose `docker compose build` cannot restore.
        run: |
          tar -czf deploy.tar.gz \
            Dockerfile \
            docker-compose.yml \
            .dockerignore \
            Directory.Build.props \
            Directory.Packages.props \
            Atria.sln \
            src \
            external

      - name: Copy bundle to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          source: "deploy.tar.gz"
          # Dedicated to this repo only — do NOT point this at /opt/atria. That path is also
          # the deploy target for the separate atria-admin-dashboard repo (nginx serves it from
          # /opt/atria/dashboard); the wipe step below once deleted that sibling folder.
          target: "/opt/atria-backend"
          overwrite: true

      - name: Build & restart the stack on the server
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Secrets from GitHub, transferred to the remote shell (via `envs` below) so
          # `docker compose` can interpolate ${POSTGRES_PASSWORD} and ${NIKITA_PRO_*}.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          NIKITA_PRO_LOGIN: ${{ secrets.NIKITA_PRO_LOGIN }}
          NIKITA_PRO_API_KEY: ${{ secrets.NIKITA_PRO_API_KEY }}
          DIDIT_API_KEY: ${{ secrets.DIDIT_API_KEY }}
          DIDIT_WEBHOOK_SECRET: ${{ secrets.DIDIT_WEBHOOK_SECRET }}
          # JWT signing secret + at-rest PII encryption key. Both are REQUIRED by docker-compose
          # (:? guards) so the app can never boot on the committed dev keys. Add them as GitHub
          # secrets: JWT_SIGNING_KEY (>=32 chars) and ENCRYPTION_KEY (base64 of exactly 32 bytes).
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          # Pepper for the stored OTP hashes. Must differ from ENCRYPTION_KEY: one leaked secret
          # should not hand over both the PII at rest and the login codes.
          OTP_HASH_PEPPER: ${{ secrets.OTP_HASH_PEPPER }}
          # Authenticates this API to the custody signer. Optional — an empty value only means the
          # request goes unsigned, which the app logs a warning about.
          BLOCKCHAIN_SIGNER_SHARED_SECRET: ${{ secrets.BLOCKCHAIN_SIGNER_SHARED_SECRET }}
          # Static admin login. Only ADMIN_PASSWORD is truly secret; username/user-id are not,
          # but are forwarded the same way so all three reach `docker compose` on the server.
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_USER_ID: ${{ secrets.ADMIN_USER_ID }}
          # Static realtor login. Only REALTOR_PASSWORD is truly secret; username/user-id are not,
          # but are forwarded the same way so all three reach `docker compose` on the server.
          REALTOR_USERNAME: ${{ secrets.REALTOR_USERNAME }}
          REALTOR_PASSWORD: ${{ secrets.REALTOR_PASSWORD }}
          REALTOR_USER_ID: ${{ secrets.REALTOR_USER_ID }}
          # SCP media host credentials (the API copies property photos/documents there). The media
          # host address and public base URL are not secret and live in appsettings.json, so they
          # are deliberately not forwarded — see the note on REFERRAL_BASE_URL below.
          MEDIA_SCP_USERNAME: ${{ secrets.MEDIA_SCP_USERNAME }}
          MEDIA_SCP_PASSWORD: ${{ secrets.MEDIA_SCP_PASSWORD }}
          # REFERRAL_BASE_URL / MEDIA_SCP_HOST are gone on purpose: they were public URLs carried as
          # deploy "secrets", which put the deployed hostnames somewhere no diff could show them.
          # They are plain values in appsettings.json now. The repository secrets can be deleted.
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          # Key first, password as a fallback. appleboy's actions use whichever is non-empty, so
          # provisioning DEPLOY_SSH_KEY later switches this over on its own — no workflow edit, and
          # the password stops being consulted the moment a key exists.
          #
          # SECURITY: a password on the production host is the weakest link in this pipeline. The
          # same session carries POSTGRES_PASSWORD, DIDIT_API_KEY and NIKITA_PRO_API_KEY to the
          # server, so whoever holds it holds those too. Finding M-14 of the 2026-08-04 review stays
          # OPEN until a key is issued and `PasswordAuthentication no` is set on the host.
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          port: ${{ secrets.DEPLOY_SSH_PORT }}
          envs: POSTGRES_PASSWORD,NIKITA_PRO_LOGIN,NIKITA_PRO_API_KEY,DIDIT_API_KEY,DIDIT_WEBHOOK_SECRET,JWT_SIGNING_KEY,ENCRYPTION_KEY,OTP_HASH_PEPPER,BLOCKCHAIN_SIGNER_SHARED_SECRET,ADMIN_USERNAME,ADMIN_PASSWORD,ADMIN_USER_ID,REALTOR_USERNAME,REALTOR_PASSWORD,REALTOR_USER_ID,MEDIA_SCP_USERNAME,MEDIA_SCP_PASSWORD
          script: |
            set -euo pipefail

            # Install Docker (incl. the compose plugin) if this is a fresh server.
            if ! command -v docker >/dev/null 2>&1; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
            fi

            cd /opt/atria-backend
            # Remove the previously-deployed source FIRST: tar -x overlays files but never
            # prunes ones deleted in git, so stale files (e.g. removed handlers) would linger
            # in the Docker build context and break the build. Preserve .env (secrets) and the
            # incoming bundle. The Postgres data lives in a Docker volume, not here, so it is safe.
            # This directory is dedicated to the backend (see the target: comment above) so this
            # wipe can never again take out the admin dashboard's files.
            find . -maxdepth 1 -mindepth 1 ! -name '.env' ! -name 'deploy.tar.gz' -exec rm -rf {} +
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz

            # Explicit -f excludes docker-compose.override.yml, so Postgres is NOT
            # published on the public host. The cleaned src/ changes the COPY layer content,
            # so Docker's cache invalidates the build automatically. Rebuilds + restarts.
            docker compose -f docker-compose.yml up -d --build

            # Reclaim space from old image layers.
            docker image prune -f

            docker compose -f docker-compose.yml ps
